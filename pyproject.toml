[tool.poetry]
name = "sonosphone"
version = "0.1.0"
description = "Control Sonos with a retro phone interface"
authors = ["Steve Hall <srhall@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
soco = "^0.23"
requests = "^2.0"
Pillow = "^9.0"
pyzbar = "^0.1"
aiohttp = "^3.8"
plexapi = "^4.0"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
pytest-asyncio = "^0.20"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
